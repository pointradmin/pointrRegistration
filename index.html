<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title is set by script.js from content.js -->
  <title>Pointr</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============================================================
       GRADIENT STRIP
       The 3px violet→amber line fixed to the very top of the page.
  ============================================================ -->
  <div class="strip"></div>


  <!-- ============================================================
       NAVIGATION
  ============================================================ -->
  <nav>
    <div class="nav-logo" id="nav-logo-text"></div>
    <div class="nav-pill" id="nav-pill-text"></div>
  </nav>


  <!-- ============================================================
       MAIN PAGE CONTENT
  ============================================================ -->
  <div class="page">


    <!-- ── HERO ─────────────────────────────────────────────── -->
    <div class="hero">

      <!-- Left: Value proposition -->
      <div class="hero-left">

        <div class="eyebrow" id="eyebrow-text"></div>

        <h1 class="hero-headline" id="hero-headline"></h1>

        <p class="hero-sub" id="hero-sub-text"></p>

        <!-- Program chips (built from content.js programs list) -->
        <div class="prog-row" id="hero-chips"></div>

        <!-- Stats bar -->
        <div class="stats" id="stats-bar"></div>

      </div><!-- /hero-left -->


      <!-- Right: Registration form -->
      <div class="hero-right">
        <div class="form-card">

          <!-- Corner mark (brand element — do not remove) -->
          <div class="corner"></div>

          <!-- Form inner (hidden on success) -->
          <div id="form-inner">

            <h2 class="form-title" id="form-title"></h2>
            <p  class="form-desc"  id="form-desc"></p>

            <!-- Incentive banner -->
            <div class="incentive">
              <div class="inc-icon"  id="inc-icon"></div>
              <div>
                <div class="inc-title" id="inc-title"></div>
                <div class="inc-desc"  id="inc-desc"></div>
              </div>
            </div>

            <!-- ════════════════════════════════════════════
                 GROUP 1: Always visible
                 Fields: First name, Email
            ════════════════════════════════════════════ -->
            <div id="form-group-1">

              <!-- First name -->
              <div class="field">
                <label for="firstName">
                  <span data-label="firstName"></span>
                  <span class="req">*</span>
                </label>
                <input type="text" id="firstName"
                       autocomplete="given-name"
                       oninput="onGroup1Change()" required>
                <div class="error-msg" id="error-firstName">Please enter your first name.</div>
              </div>

              <!-- Email -->
              <div class="field">
                <label for="email">
                  <span data-label="email"></span>
                  <span class="req">*</span>
                </label>
                <input type="email" id="email"
                       autocomplete="email"
                       oninput="onGroup1Change()" required>
                <div class="error-msg" id="error-email">Please enter a valid email address.</div>
              </div>

            </div><!-- /form-group-1 -->


            <!-- ════════════════════════════════════════════
                 GROUP 2: Revealed progressively (or all at
                 once in "all" mode — see config.js)
                 Fields: Programs, Goals, Frustration, Price
            ════════════════════════════════════════════ -->
            <div id="form-group-2" class="form-group-2">

              <div class="divider"></div>

              <!-- Programs — multi-select checkboxes -->
              <div class="field">
                <div class="sec-label" id="programs-label"></div>
                <div class="cb-grid" id="programs-grid">
                  <!-- Built by script.js from content.js programs array -->
                </div>
              </div>

              <div class="divider"></div>

              <!-- Goals — open text -->
              <div class="field">
                <label for="goals" id="goals-label"></label>
                <textarea id="goals" rows="3"></textarea>
              </div>

              <div class="divider"></div>

              <!-- Frustration — single choice pills -->
              <div class="field">
                <div class="sec-label" id="frustrations-label"></div>
                <div class="pill-grid" id="frustrations-grid">
                  <!-- Built by script.js from content.js frustrations array -->
                </div>
                <!-- "Other" textarea — appears when Other is selected -->
                <div class="other-textarea-wrap" id="frustration-other-wrap">
                  <textarea id="frustration-other-text" rows="2"
                            style="margin-top:8px"></textarea>
                </div>
              </div>

              <div class="divider"></div>

              <!-- Price — tap to select -->
              <div class="field">
                <div class="sec-label" id="price-label"></div>
                <div class="price-grid" id="price-grid">
                  <!-- Built by script.js from content.js priceOptions array -->
                </div>
              </div>

              <div class="divider"></div>

              <!-- Submit -->
              <button class="btn-primary" id="submit-btn" onclick="handleSubmit()"></button>
              <p class="submit-note" id="submit-note"></p>

              <!-- Social proof -->
              <div class="proof" id="proof-row"></div>

            </div><!-- /form-group-2 -->

          </div><!-- /form-inner -->


          <!-- ════════════════════════════════════════════
               SUCCESS STATE
               Replaces the form after submission.
          ════════════════════════════════════════════ -->
          <div class="success-state" id="success-state">
            <div class="suc-icon"    id="suc-icon"></div>
            <h3  class="suc-title"   id="suc-title"></h3>
            <p   class="suc-sub"     id="suc-message"></p>
          </div>

        </div><!-- /form-card -->
      </div><!-- /hero-right -->

    </div><!-- /hero -->


    <!-- ── FEATURES ─────────────────────────────────────────── -->
    <div class="features">
      <div class="section-head">
        <h2 id="features-title"></h2>
        <p  id="features-sub"></p>
      </div>
      <div class="feat-grid" id="features-grid">
        <!-- Built by script.js from content.js features.cards array -->
      </div>
    </div>


    <!-- ── PRIVACY NOTICE ────────────────────────────────────── -->
    <div class="privacy-notice">
      <div class="priv-title" id="privacy-title"></div>
      <div class="priv-text"  id="privacy-text"></div>
    </div>


  </div><!-- /page -->


  <!-- ── FOOTER ─────────────────────────────────────────────── -->
  <footer>
    <div class="ft-logo" id="footer-logo"></div>
    <div class="ft-note" id="footer-note"></div>
  </footer>


  <!-- ============================================================
       SCRIPTS
       Load order matters — content and config must come before script.
  ============================================================ -->
  <script src="content.js"></script>   <!-- ✏️ Edit this for all text/labels -->
  <script src="config.js"></script>    <!-- ⚙️ Edit this for behaviour toggles -->
  <script src="script.js"></script>    <!-- 🔒 Do not edit unless changing logic -->
  <!-- calculator.js is NOT loaded here — it's a separate tool -->

</body>
</html>
